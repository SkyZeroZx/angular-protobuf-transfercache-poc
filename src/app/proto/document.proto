syntax = "proto3";
package poc;

// Read-only RPC query. The URL is intentionally stable; the selector lives in the protobuf body.
message DocumentQuery {
  uint32 document_id = 1;
}

message DocumentResult {
  uint32 document_id = 1;
  string title = 2;
  string preview = 3;
  string capability = 4;
  uint32 origin_call = 5;
}
